apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-store
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
