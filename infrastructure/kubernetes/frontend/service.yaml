apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-store
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: devops-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
