apiVersion: v1
kind: Service
metadata:
  name: object-storage
  namespace: devops-store
  labels:
    app.kubernetes.io/name: object-storage
    app.kubernetes.io/part-of: devops-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: object-storage
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
