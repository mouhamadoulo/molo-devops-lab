spring:
  application:
    name: devops-store-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devops_store}
    username: ${DB_USERNAME:devops_store}
    password: ${DB_PASSWORD:devops_store}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  storage:
    initialize-bucket: ${MINIO_INITIALIZE_BUCKET:true}
    orphan-min-age: ${MINIO_ORPHAN_MIN_AGE:24h}
    orphan-reconciliation-interval: ${MINIO_ORPHAN_RECONCILIATION_INTERVAL:1h}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
      access-key: ${MINIO_ACCESS_KEY:devops_store}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:product-images}
      region: ${MINIO_REGION:us-east-1}
  identity:
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:}
    jwt:
      issuer: ${JWT_ISSUER:https://devops-store.local}
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
    auth:
      refresh-token-ttl: 7d
      cookie-secure: ${AUTH_COOKIE_SECURE:true}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

logging:
  structured:
    format:
      console: logstash
