spring:
  application:
    name: devops-store-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devops_store}
    username: ${DB_USERNAME:devops_store}
    password: ${DB_PASSWORD:devops_store}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  identity:
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:}
    jwt:
      issuer: ${JWT_ISSUER:https://devops-store.local}
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

logging:
  structured:
    format:
      console: logstash
