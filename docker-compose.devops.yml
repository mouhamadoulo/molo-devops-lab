name: devops-store-devops

services:
  sonarqube-db:
    profiles: [quality]
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_DB_USERNAME:-sonarqube}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-}
    command:
      - sh
      - -ec
      - >-
        test -n "$$POSTGRES_PASSWORD" || { echo 'SONAR_DB_PASSWORD is required' >&2; exit 1; };
        exec docker-entrypoint.sh postgres
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - quality
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 200

  sonarqube:
    profiles: [quality]
    image: sonarqube:26.9.0.129388-community@sha256:aa7146fd72ef79ea8ca06315ca3121db9bb1c24a83ba5255e8df67b43dee6e04
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USERNAME:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-temp:/opt/sonarqube/temp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:9000/api/system/status
          | grep --quiet '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - quality
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 500

  artifactory-db:
    profiles: [artifacts]
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${ARTIFACTORY_DB_NAME:-artifactory}
      POSTGRES_USER: ${ARTIFACTORY_DB_USERNAME:-artifactory}
      POSTGRES_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:-}
    command:
      - sh
      - -ec
      - >-
        test -n "$$POSTGRES_PASSWORD" || { echo 'ARTIFACTORY_DB_PASSWORD is required' >&2; exit 1; };
        exec docker-entrypoint.sh postgres
    volumes:
      - artifactory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [artifacts]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 200

  artifactory:
    profiles: [artifacts]
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.161.26@sha256:d103c0464d33645acdcbfbb6fc61310d7faf14c9893975cbee562487eaeac1d1
    environment:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://artifactory-db:5432/${ARTIFACTORY_DB_NAME:-artifactory}
      JF_SHARED_DATABASE_USERNAME: ${ARTIFACTORY_DB_USERNAME:-artifactory}
      JF_SHARED_DATABASE_PASSWORD: ${ARTIFACTORY_DB_PASSWORD:-}
      JF_SHARED_EXTRAJAVAOPTS: -Xms512m -Xmx2g
      JF_JFCONNECT_ENABLED: "false"
      JF_JFCONNECT_SERVICE_ENABLED: "false"
    ports:
      - "127.0.0.1:${ARTIFACTORY_PORT:-8082}:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf "GET /router/api/v1/system/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    depends_on:
      artifactory-db:
        condition: service_healthy
    networks: [artifacts]
    restart: unless-stopped
    stop_grace_period: 120s
    security_opt: [no-new-privileges:true]
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 1000

  jcr-db:
    profiles: [registry]
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${JCR_DB_NAME:-jcr}
      POSTGRES_USER: ${JCR_DB_USERNAME:-jcr}
      POSTGRES_PASSWORD: ${JCR_DB_PASSWORD:-}
    command:
      - sh
      - -ec
      - >-
        test -n "$$POSTGRES_PASSWORD" || { echo 'JCR_DB_PASSWORD is required' >&2; exit 1; };
        exec docker-entrypoint.sh postgres
    volumes:
      - jcr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [registry]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 200

  jcr:
    profiles: [registry]
    image: releases-docker.jfrog.io/jfrog/artifactory-jcr:7.161.26@sha256:fd8d64416384c2ede4478c89bfa85ba7e9193db4db0dc36db3a307a0b9a5128b
    environment:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://jcr-db:5432/${JCR_DB_NAME:-jcr}
      JF_SHARED_DATABASE_USERNAME: ${JCR_DB_USERNAME:-jcr}
      JF_SHARED_DATABASE_PASSWORD: ${JCR_DB_PASSWORD:-}
      JF_SHARED_EXTRAJAVAOPTS: -Xms512m -Xmx2g
    ports:
      - "127.0.0.1:${JCR_PORT:-8084}:8082"
    volumes:
      - jcr-data:/var/opt/jfrog/artifactory
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf "GET /router/api/v1/system/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    depends_on:
      jcr-db:
        condition: service_healthy
    networks: [registry]
    restart: unless-stopped
    stop_grace_period: 120s
    security_opt: [no-new-privileges:true]
    cpus: 4.0
    mem_limit: 4g
    pids_limit: 1000

  artifactory-bootstrap:
    profiles: [artifacts-tools]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    environment:
      JFROG_INTERNAL_URL: http://artifactory:8082/artifactory
      JFROG_ADMIN_TOKEN: ${JFROG_ADMIN_TOKEN:-}
    volumes:
      - ./infrastructure/jfrog/bootstrap.sh:/opt/jfrog/bootstrap.sh:ro
      - ./infrastructure/jfrog/repositories:/opt/jfrog/repositories:ro
    entrypoint: [/bin/sh, /opt/jfrog/bootstrap.sh]
    depends_on:
      artifactory:
        condition: service_healthy
    networks: [artifacts]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 50

  artifactory-promote:
    profiles: [artifacts-tools]
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    environment:
      JFROG_INTERNAL_URL: http://artifactory:8082/artifactory
      JFROG_ADMIN_TOKEN: ${JFROG_ADMIN_TOKEN:-}
      VERSION: ${VERSION:-}
    volumes:
      - ./infrastructure/jfrog/promote.sh:/opt/jfrog/promote.sh:ro
    entrypoint: [/bin/sh, /opt/jfrog/promote.sh]
    depends_on:
      artifactory:
        condition: service_healthy
    networks: [artifacts]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 50

  artifactory-resolve:
    profiles: [artifacts-tools]
    image: maven:3.9.16-eclipse-temurin-25@sha256:31618505df21177d2baa3dc574be2d0b0b32614c8539baca1f23a9136b766eb0
    environment:
      JFROG_URL: http://artifactory:8082/artifactory
      JFROG_USERNAME: ${JFROG_USERNAME:-}
      JFROG_TOKEN: ${JFROG_TOKEN:-}
      VERSION: ${VERSION:-}
    volumes:
      - ./infrastructure/jfrog/settings.xml.example:/opt/jfrog/settings.xml:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        test -n "$$VERSION" || { echo 'VERSION is required' >&2; exit 1; };
        test -n "$$JFROG_USERNAME" || { echo 'JFROG_USERNAME is required' >&2; exit 1; };
        test -n "$$JFROG_TOKEN" || { echo 'JFROG_TOKEN is required' >&2; exit 1; };
        mkdir -p /tmp/consumer /tmp/m2/repository;
        cd /tmp/consumer;
        mvn -B -s /opt/jfrog/settings.xml
        -Dmaven.repo.local=/tmp/m2/repository dependency:get
        -Dartifact=com.molo:devops-store-backend:$$VERSION -Dtransitive=false
    depends_on:
      artifactory:
        condition: service_healthy
    networks: [artifacts]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 200

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    user: "65532:65532"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - observability
      - observability-shared
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    user: "472:0"
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; };
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:3000/api/health | grep -q 'database.*ok'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - observability
      - observability-shared
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200

  socket-proxy:
    profiles: [observability]
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    user: "65534:${DOCKER_GID:-0}"
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -proxyport=2375
      - -allowfrom=alloy
      - -allowGET=/v1\..{1,2}/(version|containers|containers/.*|networks|networks/.*)
      - -allowPOST=/v1\..{1,2}/containers/.*/logs
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    restart: unless-stopped
    stop_grace_period: 10s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 50

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability
      - observability-shared
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    user: "473:473"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345; printf ''GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3; grep -q ''200 OK'' <&3'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      socket-proxy:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - observability
      - observability-shared
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200

networks:
  quality:
    driver: bridge
  artifacts:
    driver: bridge
  registry:
    driver: bridge
  observability:
    driver: bridge
    internal: true
  observability-shared:
    name: devops-store-observability
    external: true

volumes:
  sonarqube-postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-temp:
  artifactory-postgres-data:
  artifactory-data:
  jcr-postgres-data:
  jcr-data:
  prometheus-data:
    name: devops-store-prometheus-data
  grafana-data:
    name: devops-store-grafana-data
  loki-data:
    name: devops-store-loki-data
  alloy-data:
    name: devops-store-alloy-data
