<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">DevOps Store — chaîne DevSecOps</title>
  <desc id="desc">Le code passe par GitHub Actions, SonarQube, Trivy et Artifactory avant d'être déployé avec Docker Compose ou Kubernetes. L'application Angular, Nginx, Spring Boot, PostgreSQL et AIStor est observée par Prometheus, Grafana, Loki et Alloy.</desc>
  <style>
    .bg { fill: #0f172a; }
    .panel { fill: #131d33; stroke: #24314f; stroke-width: 1; }
    .box { fill: #18233d; stroke: #2c3b5e; stroke-width: 1; }
    .h1 { font: 700 26px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #f1f5f9; }
    .sub { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
    .stage { font: 600 10px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; letter-spacing: 1.2px; text-transform: uppercase; }
    .tool { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e2e8f0; }
    .small { font: 400 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
    .label { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #cbd5e1; letter-spacing: 1.2px; text-transform: uppercase; }
    .wire { fill: none; stroke: #2c3b5e; stroke-width: 2; }
    .flow { fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
    .flow-obs { fill: none; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
    .glow { fill: none; stroke: #2dd4bf; stroke-width: 2; opacity: 0; animation: glow 6s ease-out infinite; }
    .pulse-obs { fill: #a78bfa; animation: blink 2s ease-in-out infinite; }
    .d1 { animation-delay: 1.2s; } .d2 { animation-delay: 2.4s; } .d3 { animation-delay: 3.6s; }
    .d4 { animation-delay: 4.8s; } .d5 { animation-delay: 5.99s; }
    .b1 { animation-delay: 0.5s; } .b2 { animation-delay: 1s; } .b3 { animation-delay: 1.5s; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes glow { 0% { opacity: 1; } 18% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .flow-obs, .glow, .pulse-obs { animation: none; }
      .glow { opacity: 0; }
      .pulse-obs { opacity: 1; }
      .mover { display: none; }
    }
  </style>

  <rect class="bg" width="960" height="470" rx="16"/>

  <!-- En-tête -->
  <text class="h1" x="35" y="52">DevOps Store</text>
  <text class="sub" x="35" y="76">Laboratoire DevSecOps de bout en bout autour d'un catalogue de produits</text>

  <!-- Chaîne de livraison -->
  <text class="label" x="35" y="112">Chaîne de livraison</text>
  <path class="wire" d="M100,163 H860"/>
  <path class="flow" d="M100,163 H860"/>
  <!-- Impulsion qui parcourt la chaîne, sous les étapes -->
  <circle class="mover" r="5" fill="#2dd4bf">
    <animateMotion dur="6s" repeatCount="indefinite" path="M100,163 H860"/>
  </circle>

  <g>
    <rect class="box" x="35" y="128" width="130" height="70" rx="10"/>
    <rect class="glow" x="35" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="100" y="154" text-anchor="middle">Code</text>
    <text class="tool" x="100" y="176" text-anchor="middle">Git · GitHub</text>
  </g>
  <g>
    <rect class="box" x="187" y="128" width="130" height="70" rx="10"/>
    <rect class="glow d1" x="187" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="252" y="154" text-anchor="middle">Intégration</text>
    <text class="tool" x="252" y="176" text-anchor="middle">GitHub Actions</text>
  </g>
  <g>
    <rect class="box" x="339" y="128" width="130" height="70" rx="10"/>
    <rect class="glow d2" x="339" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="404" y="154" text-anchor="middle">Qualité</text>
    <text class="tool" x="404" y="176" text-anchor="middle">SonarQube</text>
  </g>
  <g>
    <rect class="box" x="491" y="128" width="130" height="70" rx="10"/>
    <rect class="glow d3" x="491" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="556" y="154" text-anchor="middle">Sécurité</text>
    <text class="tool" x="556" y="176" text-anchor="middle">Trivy</text>
  </g>
  <g>
    <rect class="box" x="643" y="128" width="130" height="70" rx="10"/>
    <rect class="glow d4" x="643" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="708" y="154" text-anchor="middle">Artefacts</text>
    <text class="tool" x="708" y="176" text-anchor="middle">Artifactory</text>
  </g>
  <g>
    <rect class="box" x="795" y="128" width="130" height="70" rx="10"/>
    <rect class="glow d5" x="795" y="128" width="130" height="70" rx="10"/>
    <text class="stage" x="860" y="154" text-anchor="middle">Déploiement</text>
    <text class="tool" x="860" y="176" text-anchor="middle">Compose · K8s</text>
  </g>

  <!-- Livraison vers le runtime -->
  <path class="wire" d="M860,198 V224 H305 V252"/>
  <path class="flow" d="M860,198 V224 H305 V252"/>

  <!-- Application -->
  <rect class="panel" x="35" y="252" width="560" height="172" rx="12"/>
  <text class="label" x="55" y="278">Application</text>

  <rect class="box" x="55" y="306" width="140" height="62" rx="10"/>
  <text class="tool" x="125" y="333" text-anchor="middle">Angular 22</text>
  <text class="small" x="125" y="352" text-anchor="middle">servi par Nginx</text>

  <rect class="box" x="235" y="306" width="150" height="62" rx="10"/>
  <text class="tool" x="310" y="333" text-anchor="middle">Spring Boot 4</text>
  <text class="small" x="310" y="352" text-anchor="middle">Java 25 · JWT · RBAC</text>

  <rect class="box" x="435" y="282" width="140" height="52" rx="10"/>
  <text class="tool" x="505" y="304" text-anchor="middle">PostgreSQL 18</text>
  <text class="small" x="505" y="321" text-anchor="middle">Flyway</text>

  <rect class="box" x="435" y="352" width="140" height="52" rx="10"/>
  <text class="tool" x="505" y="374" text-anchor="middle">AIStor</text>
  <text class="small" x="505" y="391" text-anchor="middle">images privées S3</text>

  <path class="wire" d="M195,337 H235"/>
  <path class="flow" d="M195,337 H235"/>
  <path class="wire" d="M385,337 H410 V308 H435 M410,337 V378 H435"/>
  <path class="flow" d="M385,337 H410 V308 H435 M410,337 V378 H435"/>

  <!-- Observabilité -->
  <path class="wire" d="M595,337 H625"/>
  <path class="flow-obs" d="M595,337 H625"/>
  <rect class="panel" x="625" y="252" width="300" height="172" rx="12"/>
  <text class="label" x="645" y="278">Observabilité</text>
  <circle class="pulse-obs" cx="903" cy="274" r="4"/>

  <rect class="box" x="645" y="294" width="130" height="50" rx="10"/>
  <circle class="pulse-obs" cx="661" cy="319" r="3"/>
  <text class="tool" x="718" y="324" text-anchor="middle">Prometheus</text>

  <rect class="box" x="785" y="294" width="120" height="50" rx="10"/>
  <circle class="pulse-obs b1" cx="801" cy="319" r="3"/>
  <text class="tool" x="851" y="324" text-anchor="middle">Grafana</text>

  <rect class="box" x="645" y="356" width="130" height="50" rx="10"/>
  <circle class="pulse-obs b2" cx="661" cy="381" r="3"/>
  <text class="tool" x="718" y="386" text-anchor="middle">Loki</text>

  <rect class="box" x="785" y="356" width="120" height="50" rx="10"/>
  <circle class="pulse-obs b3" cx="801" cy="381" r="3"/>
  <text class="tool" x="851" y="386" text-anchor="middle">Alloy</text>

  <!-- Pied -->
  <text class="small" x="480" y="452" text-anchor="middle">Docker Compose · Kubernetes 1.36 · Terraform 1.15 · métriques et journaux de bout en bout</text>
</svg>
